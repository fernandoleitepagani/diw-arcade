<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>DIW Arcade — imagem de compartilhamento</title>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("../../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-400-normal.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-600-normal.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-700-normal.woff2")
          format("woff2");
      }

      :root {
        --bg: #0a1128;
        --surface: #111a36;
        --surface-2: #1a2547;
        --surface-3: #24305a;
        --border: #2c3a66;
        --text: #e8eefc;
        --text-muted: #a8b4d4;
        --accent: #2de2e6;
        --reward: #ff4fd8;
        --xp: #ffc23d;
        --success: #7cff6b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Hanken Grotesk", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .og {
        position: relative;
        display: flex;
        align-items: center;
        gap: 60px;
        width: 1200px;
        height: 630px;
        padding: 60px;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 18%, rgb(45 226 230 / 0.16), transparent 38%),
          radial-gradient(circle at 88% 84%, rgb(255 79 216 / 0.13), transparent 42%),
          var(--bg);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(44 58 102 / 0.32) 1px, transparent 1px),
          linear-gradient(90deg, rgb(44 58 102 / 0.32) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(180deg, rgb(0 0 0 / 0.9), rgb(0 0 0 / 0.35));
      }

      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgb(255 255 255 / 0.035) 0 1px,
          transparent 1px 4px
        );
        pointer-events: none;
      }

      .left {
        position: relative;
        z-index: 1;
        flex: none;
        width: 580px;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 22px;
        color: var(--text-muted);
        font-size: 18px;
        font-weight: 600;
        line-height: 1.4;
      }

      .kicker::before {
        content: "";
        flex: none;
        width: 10px;
        height: 10px;
        background: var(--accent);
        box-shadow: 14px 0 0 var(--reward), 28px 0 0 var(--xp);
      }

      .kicker span {
        margin-left: 28px;
      }

      .wordmark {
        margin: 0;
        color: var(--accent);
        font-family: "Pixelify Sans", monospace;
        font-size: 80px;
        font-weight: 400;
        line-height: 1.08;
        filter: drop-shadow(0 0 24px rgb(45 226 230 / 0.28));
        text-shadow: 6px 6px 0 var(--surface);
      }

      .wordmark span {
        display: block;
      }

      .subline {
        max-width: 560px;
        margin: 24px 0 30px;
        color: var(--text);
        font-size: 25px;
        line-height: 1.45;
        text-wrap: pretty;
      }

      .modes {
        display: flex;
        gap: 26px;
        margin: 0;
        padding: 0;
        color: var(--text-muted);
        font-size: 17px;
        font-weight: 600;
        line-height: 1.4;
        list-style: none;
      }

      .modes li {
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
      }

      .pip {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 1px;
      }

      .pip--quiz {
        background: var(--accent);
      }

      .pip--cards {
        background: var(--reward);
      }

      .pip--code {
        background: var(--xp);
      }

      .pip--labs {
        background: var(--success);
      }

      .cabinet {
        position: relative;
        z-index: 1;
        flex: none;
        width: 440px;
        padding: 14px;
        border: 2px solid var(--border);
        border-radius: 16px;
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
        box-shadow:
          0 0 0 6px var(--bg),
          0 0 0 8px var(--surface-3),
          0 30px 60px rgb(0 0 0 / 0.55),
          0 0 46px rgb(45 226 230 / 0.12);
      }

      .screen {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 396px;
        padding: 26px;
        overflow: hidden;
        border: 2px solid var(--surface-3);
        border-radius: 10px;
        background:
          radial-gradient(circle at 50% 36%, #16213f 0%, #060b1c 72%);
      }

      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgb(255 255 255 / 0.05) 0 1px,
          transparent 1px 4px
        );
        pointer-events: none;
      }

      .screen > * {
        position: relative;
        z-index: 1;
      }

      .bubble {
        position: relative;
        padding: 11px 18px;
        border: 2px solid var(--accent);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 22px;
        font-weight: 600;
        line-height: 1.3;
        box-shadow: 0 0 20px rgb(45 226 230 / 0.18);
      }

      .bubble::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        width: 12px;
        height: 12px;
        border-right: 2px solid var(--accent);
        border-bottom: 2px solid var(--accent);
        background: var(--surface-2);
        transform: translateX(-50%) rotate(45deg);
      }

      .bit {
        width: 190px;
        height: 190px;
        image-rendering: pixelated;
        filter: drop-shadow(0 0 22px rgb(45 226 230 / 0.24));
      }

      .hud {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }

      .hud strong {
        color: var(--accent);
        font-family: "Pixelify Sans", monospace;
        font-size: 11px;
        font-weight: 400;
      }

      .stars {
        display: flex;
        gap: 3px;
      }

      .stars svg {
        width: 14px;
        height: 14px;
        fill: var(--xp);
      }
    </style>
  </head>
  <body>
    <main class="og">
      <div class="grid"></div>

      <section class="left">
        <p class="kicker"><span>Desenvolvimento de Interfaces Web · PUC Minas</span></p>
        <h1 class="wordmark"><span>DIW</span><span>ARCADE</span></h1>
        <p class="subline">
          Quiz, cartas e desafios de código no seu navegador. Ganhe XP, acenda
          estrelas e domine a matéria.
        </p>
        <ul class="modes">
          <li><span class="pip pip--quiz"></span>Quiz</li>
          <li><span class="pip pip--cards"></span>Cartas</li>
          <li><span class="pip pip--code"></span>Desafios</li>
          <li><span class="pip pip--labs"></span>Laboratórios</li>
        </ul>
      </section>

      <aside class="cabinet" aria-label="Bit, o mascote, no monitor do fliperama">
        <div class="screen">
          <p class="bubble">Bora praticar?</p>
          <svg
            class="bit"
            viewBox="0 0 16 16"
            role="img"
            aria-label="Bit, o robô mascote"
            shape-rendering="crispEdges"
          >
            <rect x="7" y="0" width="2" height="1" fill="#ff4fd8" />
            <rect x="7" y="1" width="2" height="1" fill="#2c3a66" />
            <rect x="1" y="5" width="1" height="3" fill="#2de2e6" />
            <rect x="14" y="5" width="1" height="3" fill="#2de2e6" />
            <rect
              x="2"
              y="2"
              width="12"
              height="11"
              fill="#1a2547"
              stroke="#2c3a66"
              stroke-width="1"
            />
            <rect x="4" y="4" width="8" height="4" fill="#0a1128" />
            <rect x="5" y="5" width="2" height="2" fill="#2de2e6" />
            <rect x="9" y="5" width="2" height="2" fill="#2de2e6" />
            <rect x="5" y="10" width="6" height="2" fill="#111a36" />
            <rect x="6" y="11" width="1" height="1" fill="#ffc23d" />
            <rect x="9" y="11" width="1" height="1" fill="#7cff6b" />
            <rect x="5" y="13" width="2" height="2" fill="#2c3a66" />
            <rect x="9" y="13" width="2" height="2" fill="#2c3a66" />
          </svg>
          <p class="hud">
            <strong>n07</strong>
            <span class="stars" aria-hidden="true">
              <svg viewBox="0 0 12 12">
                <path d="M6 0l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9L2.4 11l.7-4L.2 4.3l4-.6z" />
              </svg>
              <svg viewBox="0 0 12 12">
                <path d="M6 0l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9L2.4 11l.7-4L.2 4.3l4-.6z" />
              </svg>
              <svg viewBox="0 0 12 12">
                <path d="M6 0l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9L2.4 11l.7-4L.2 4.3l4-.6z" />
              </svg>
            </span>
            <span>domínio completo</span>
          </p>
        </div>
      </aside>

      <div class="scanlines"></div>
    </main>
  </body>
</html>
